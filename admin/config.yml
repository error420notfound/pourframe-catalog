      preview: false
    fields:
      - name: id
        label: Id
        required: true
        widget: string
        pattern:
          - ^(?!index$)[a-z0-9]+(?:-[a-z0-9]+)*$
          - Use a lowercase kebab-case ID; index is reserved.
        hint: Permanent ID and filename. Existing IDs cannot be changed; saving enforces this.
      - name: name
        label: Name
        required: true
        widget: string
        pattern:
          - ^[\s\S]{1,120}$
