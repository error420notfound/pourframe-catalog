      - name: country
        label: Country
        required: false
        widget: string
        pattern:
          - ^[\s\S]{0,80}$
          - Value must match the catalog schema (format and length).
      - name: city
        label: City
        required: false
        widget: string
        pattern:
          - ^[\s\S]{0,80}$
          - Value must match the catalog schema (format and length).
      - name: website
        label: Website
        required: false
        widget: string
        pattern:
          - ^[A-Za-z][A-Za-z0-9+.-]*:\S+$
          - Enter an absolute source URL.
      - name: logoUrl
        label: Logo Url
        required: false
        widget: string
        pattern:
          - ^[A-Za-z][A-Za-z0-9+.-]*:\S+$
          - Enter an absolute source URL.
      - name: instagram
        label: Instagram
        required: false
        widget: string
        pattern:
          - ^@[A-Za-z0-9._]+$
          - Value must match the catalog schema (format and length).
      - name: description
        label: Description
        required: false
        widget: text
        pattern:
          - ^[\s\S]{0,500}$
          - Value must match the catalog schema (format and length).
      - name: active
        label: Active
        required: false
        widget: boolean
        default: false
      - name: sortOrder
        label: Sort Order
        required: false
        widget: number
        value_type: int
        step: 1
        min: 0
