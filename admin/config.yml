# Generated from schemas by npm run generate:cms. Do not hand-edit.
backend:
  name: github
  repo: error420notfound/pourframe-catalog
  branch: main
  base_url: https://pourframe-catalog-auth.9h24z9jnfy.workers.dev
  auth_endpoint: auth
publish_mode: editorial_workflow
site_url: https://error420notfound.github.io/pourframe-catalog/
media_folder: media/uploads
