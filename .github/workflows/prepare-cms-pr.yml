name: Prepare CMS indexes

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cms-indexes-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'cms/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: read
    steps:
      # Never execute PR-controlled scripts with this job's write credentials.
      - name: Check out trusted base tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: tooling
          persist-credentials: false
      - name: Check out CMS data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install trusted validation dependencies
        working-directory: tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate, validate, commit and report the resulting commit
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const prepare = require('./tooling/scripts/prepare-cms-pr.cjs');
            await prepare({ github, context, core });
